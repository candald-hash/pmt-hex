<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de Conexão</title>
<style>
:root{--bg:#101318;--panel:#1c2129;--line:#323a47;--txt:#eef1f5;--mut:#9aa3b2;--ok:#4ade80;--no:#f87171;--acc:#ffcb05}
@media (prefers-color-scheme: light){:root{--bg:#eef1f5;--panel:#fff;--line:#d5dae3;--txt:#151a22;--mut:#5d6675;--ok:#15803d;--no:#b91c1c;--acc:#c99700}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px 16px}
main{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
h1{font-size:20px;margin:0 0 6px}p{color:var(--mut);margin:6px 0 14px}
button{font:700 15px Inter,sans-serif;background:var(--acc);color:#111;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.l{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}.mut{color:var(--mut)}
#res{margin-top:14px}#fim{margin-top:14px}
</style></head><body><main>
<h1>Teste de conexão do PMT HEX</h1>
<p>Verifica se este aparelho/rede consegue usar o modo on-line. Leva cerca de 10 segundos.</p>
<button id="go">Testar</button>
<div id="res"></div><div id="fim"></div>
</main>
<script>
const TURN = { urls: ['turn:free.expressturn.com:3478', 'turn:free.expressturn.com:3478?transport=tcp'], username: '000000002110823127', credential: 'rhsNpUQSRp67g8NYSc5B7Z9eJ0g=' };
function coleta(cfg) {
  return new Promise(res => {
    let pc; try { pc = new RTCPeerConnection(cfg); } catch (e) { return res([]); }
    const tipos = new Set(); pc.onicecandidate = e => { if (e.candidate) { const m = / typ (\w+)/.exec(e.candidate.candidate); if (m) tipos.add(m[1]); } };
    pc.createDataChannel('t'); pc.createOffer().then(o => pc.setLocalDescription(o));
    setTimeout(() => { pc.close(); res([...tipos]); }, 7000);
  });
}
async function sinal() { try { const r = await fetch('https://0.peerjs.com/peerjs/id?ts=' + Date.now(), { cache: 'no-store' }); return r.ok; } catch (e) { return false; } }
const linha = (n, ok, extra) => `<div class="l"><span>${n}</span><span class="${ok ? 'ok' : 'no'}">${ok ? '✔ ok' : '✖ falhou'}${extra ? ' <span class="mut">' + extra + '</span>' : ''}</span></div>`;
document.getElementById('go').onclick = async () => {
  const R = document.getElementById('res'), F = document.getElementById('fim'); R.innerHTML = '<p>Testando…</p>'; F.innerHTML = '';
  const [s, stun, turn] = await Promise.all([sinal(), coleta({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }), coleta({ iceServers: [TURN], iceTransportPolicy: 'relay' })]);
  const okStun = stun.includes('srflx'), okTurn = turn.includes('relay');
  R.innerHTML = linha('Servidor de salas (PeerJS)', s) + linha('Conexão direta (STUN)', okStun) + linha('Retransmissão (TURN)', okTurn);
  F.innerHTML = !s ? '<p class="no">Este aparelho não alcança o servidor de salas. Desative VPN, bloqueadores de anúncio/privacidade ou tente outra rede.</p>'
    : okTurn ? '<p class="ok">Tudo certo: o modo on-line deve funcionar nesta rede.</p>'
    : okStun ? '<p>A conexão direta funciona, mas a retransmissão não. Deve funcionar com a maioria dos jogadores; se não, tente outra rede.</p>'
    : '<p class="no">Esta rede bloqueia as conexões do jogo. Tente outra rede (ex.: Wi-Fi em vez de 4G) ou desative a VPN.</p>';
};
</script></body></html>
