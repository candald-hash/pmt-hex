<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Master Trainer: HEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202610281535">
</head>
<body>
<div id="setup" class="screen"></div>
<div id="game" class="screen" hidden>
  <main id="boardWrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"><g id="vp"><g id="lHex"></g><g id="lSlots"></g><g id="lSpaces"></g><g id="lPawns"></g></g></svg>
    <div id="boardTools">
      <button id="zoomFit" title="Enquadrar tabuleiro">⤢</button>
      <button id="zoomMe" title="Ir até o meu peão">◎</button>
    </div>
    <div id="boardHint" hidden></div>
  </main>
  <aside id="side">
    <section id="turnBox"></section>
    <nav id="mTabs"><button data-tab="ficha">🎒 Ficha</button><button data-tab="jogadores">👥 Jogadores</button><button data-tab="registro">📜 Registro</button><button data-tab="cfg">⚙</button></nav>
    <section id="meBox"></section>
    <section id="othersBox"></section>
    <section id="logBox" class="sec" data-sec="log"><h3 class="logHead secHead">Registro<span class="seta">▾</span><span style="flex:1"></span><button class="sm" id="logMax" title="Ver o registro completo">⤢ ampliar</button></h3><div id="log" class="secBody"></div></section>
  </aside>
</div>
<div id="modal" hidden><div id="modalCard"></div></div>
<div id="zoomCard" hidden></div>
<div id="tip" hidden></div>
<div id="dadoFx" hidden></div>
<div id="parqueFx" hidden></div>
<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/data.js?v=202610281535"></script>
<script src="js/engine.js?v=202610281535"></script>
<script src="js/ai.js?v=202610281535"></script>
<script src="js/ui.js?v=202610281535"></script>
</body>
</html>
